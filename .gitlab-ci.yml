# GitLab CI: страховочная проверка серверов, когда ПК выключен.
#
# Особенности тарифа: Free = 400 compute-минут в месяц. Джоб здесь намеренно
# короткий (без замера скорости, ограниченное число нод), а расписание — раз в
# 6 часов: 4 запуска в сутки × ~2 минуты ≈ 250 минут в месяц, влезает в квоту.
# Основное обновление делает локальная задача на ПК (каждые 20 минут).

stages: [refresh]

refresh:
  stage: refresh
  image: python:3.12-slim
  timeout: 15m
  interruptible: true
  resource_group: refresh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    PUBLISH: "1"
    GIT_STRATEGY: clone
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip git ca-certificates >/dev/null
    - pip install --quiet --no-cache-dir -r requirements.txt
    - curl -sSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
    - mkdir -p bin && unzip -qo xray.zip -d bin && chmod +x bin/xray && ./bin/xray version | head -2
  script:
    - export XRAY_BIN="$CI_PROJECT_DIR/bin/xray"
    - python -m qrservice.run --config config.json --out dist --publish --no-speed --limit "${CHECK_LIMIT:-160}"
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - dist/
